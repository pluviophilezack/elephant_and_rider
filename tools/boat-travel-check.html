<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><title>碼頭往返測試</title>
<link rel="stylesheet" href="/style.css"><style>button,pre {font:inherit}</style>
<body style="margin:0;background:#211b33;color:#fff;font-size:15px">
<button id="run" disabled>執行完整往返測試（約 23 秒）</button>
<button id="restart" disabled>重啟場景</button>
<pre id="result">載入遊戲素材…</pre><div id="game"></div>
<script type="module">
import * as Phaser from 'phaser';
import { Overworld } from '/src/game/scenes/Overworld.js';
import { DOCKS, BOAT_ROUTE, BOAT_TRIP_DURATION } from '/src/game/core/BoatTravel.js';
import { DialogueSystem } from '/src/game/core/DialogueSystem.js';
import { THEME_FONT } from '/src/game/core/theme.js';
const result = document.querySelector('#result');
const run = document.querySelector('#run');
const restart = document.querySelector('#restart');
let scene, running = false;
const report = message => { result.textContent += '\n' + message; };
const check = (value, label) => { if (!value) throw new Error(label); report('PASS ' + label); };
const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
window.addEventListener('error', event => report('FAIL ' + event.message));
class TestOverworld extends Overworld {
    preload() {
        for (const path of Object.keys(import.meta.glob('/public/assets/**/*.{png,webp}'))) {
            const key = path.split('/').pop().replace(/\.[^.]+$/, '');
            if (!this.textures.exists(key)) this.load.image(key, path.replace('/public', ''));
        }
    }
    create() {
        super.create();
        scene = this;
        this.player.body.reset(DOCKS.mainland.landing.x, DOCKS.mainland.landing.y);
        result.textContent = 'READY：真實 Overworld 場景、事件與碰撞系統已載入';
        run.disabled = false;
        restart.disabled = false;
    }
}
async function voyage(from, to) {
    const arrived = new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('航程逾時')), 16000);
        scene.events.once('boat:arrived', key => {clearTimeout(timer); resolve(key);});
    });
    // Walk with the real controller/physics from shore all the way to the pier end.
    const zone = scene.boatTravel.docks[from].zone;
    scene.player.body.reset(DOCKS[from].landing.x, DOCKS[from].landing.y);
    scene.playerController.cursors.right.isDown = true;
    for (let i=0; i<100 && !scene.boatTravel.isTravelling; i++) await pause(50);
    scene.playerController.cursors.right.isDown = false;
    const started = performance.now();
    if (!scene.boatTravel.isTravelling) report(JSON.stringify({ x:scene.player.x,y:scene.player.y,body:[scene.player.body.x,scene.player.body.y,scene.player.body.width,scene.player.body.height],enabled:scene.playerController.enabled,auto:scene.playerController.isAutoMoving,armed:scene.boatTravel.armed,atDock:scene.physics.overlap(scene.player,scene.boatTravel.docks[from].zone),dock:scene.boatTravel.currentDock,dialogue:scene.isDialogueActive }));
    check(scene.boatTravel.isTravelling, from + '：從岸邊走到碼頭末端自動登船');
    check(!scene.player.body.enable && !scene.playerController.enabled, '航行期間停用玩家物理與移動');
    check(scene.playerController.isAutoMoving && scene.boatTravel.passenger.visible, '鎖定魔杖並顯示船上乘客');
    check(scene.boatTravel.passenger.depth < scene.boatTravel.boat.depth && scene.boatTravel.passenger.depth > scene.boatTravel.docks[from].image.depth, '航行圖層：船 > 玩家 > 碼頭');
    await pause(4500);
    check(scene.boatTravel.isTravelling, '途中維持航行狀態');
    check(!scene.isDialogueActive, '途中未觸發其他事件對話');
    check(await arrived === to, '抵達 ' + to);
    const elapsed = performance.now() - started;
    check(Math.abs(elapsed - BOAT_TRIP_DURATION) < 1500, '單程約 10 秒：' + Math.round(elapsed) + 'ms');
    check(scene.player.body.enable && scene.playerController.enabled, '下船恢復物理與操作');
    check(!scene.physics.overlap(scene.player, scene.terrainCollision.walls), '落點未卡入河流或山丘');
    check(!scene.physics.overlap(scene.player, scene.boatTravel.docks[to].zone), '落點完全離開登船範圍');
    check(Phaser.Math.Distance.Between(scene.player.x, scene.player.y, DOCKS[to].landing.x, DOCKS[to].landing.y) < 5, '落點正確');
    await pause(1100);
    check(!scene.boatTravel.isTravelling, '下船後不會立即重複登船');
}
run.onclick = async () => {
    if (running) return;
    running = true; run.disabled = true; restart.disabled = true;
    result.textContent = 'RUNNING';
    try {
        check(document.fonts.check('20px naikaifont'), 'naikaifont 已載入');
        const texts=[];
        const visit=objects=>objects.forEach(object=>{if(object.type==='Text')texts.push(object);if(object.list)visit(object.list);});
        visit(scene.children.list);
        check(texts.every(text=>text.style.fontFamily===THEME_FONT), '目前遊戲文字統一使用 THEME_FONT');
        check(scene.player.depth<scene.boatTravel.boat.depth && Object.values(scene.boatTravel.docks).every(dock=>scene.player.depth>dock.image.depth), '岸上圖層：船 > 玩家 > 碼頭');
        const dev=scene.devToolsManager;
        scene.hud.setRainStoneCount(1);
        dev.isDevMode=false;
        dev.decreaseStonesKey.emit('down');
        dev.increaseStonesKey.emit('down');
        check(scene.hud.rainStoneCount===1, '一般模式 F3/F4 無效');
        dev.isDevMode=true;
        dev.decreaseStonesKey.emit('down');
        check(scene.hud.rainStoneCount===0, '開發模式 F3 減一，可歸零');
        dev.decreaseStonesKey.emit('down');
        check(scene.hud.rainStoneCount===0, '零顆時不會變負數');
        for(let i=0;i<5;i++) dev.increaseStonesKey.emit('down');
        check(scene.hud.rainStoneCount===5 && !scene.isEndingTriggered, 'F4 每次加一，可加到五顆且不觸發結局');
        dev.increaseStonesKey.emit('down');dev.increaseStonesKey.emit('down');
        check(scene.hud.rainStoneCount===6, '上限為六顆');
        dev.isDevMode=false;
        scene.hud.setRainStoneCount(0);
        check(scene.terrainCollision.walls.getChildren().every(wall => wall.body.debugShowBody), '碰撞框線全部顯示');
        for (const [key,dock] of Object.entries(DOCKS)) {
            check(dock.berth.x > dock.x && dock.berth.y === dock.y, dock.name+'：船停在正右側');
            check(dock.landing.x < dock.x && dock.landing.y === dock.y, dock.name+'：落點在正左側');
            const b=scene.player.body;
            const x=dock.landing.x+b.x-scene.player.x, y=dock.landing.y+b.y-scene.player.y;
            check(!scene.terrainCollision.walls.getChildren().some(w=>w.body.x<x+b.width && w.body.right>x && w.body.y<y+b.height && w.body.bottom>y), dock.name+'：整個玩家碰撞箱落在陸地');
            check(scene.boatTravel.docks[key].zone.x>dock.x+100, dock.name+'：登船區在靠船的末端');
        }
        check(!scene.boatTravel.caption && Object.values(scene.boatTravel.docks).every(dock=>!dock.label), '移除码頭與航行提示字');
        const path = new Phaser.Curves.Spline(BOAT_ROUTE.flat());
        for (let i=0; i<=100; i++) {
            const p = path.getPoint(i/100);
            if (!scene.terrainCollision.walls.getChildren().some(wall=>wall.body.hitTest(p.x,p.y))) throw new Error('航線離開河道：'+i);
        }
        report('PASS 航線 101 個取樣點均位於河道');
        for (const [name,x,y] of [['守衛',4070,2280],['祭壇',4370,2220]]) {
            check(!scene.terrainCollision.walls.getChildren().some(wall=>wall.body.hitTest(x,y)), name+'位於可通行陸地');
        }
        for (const count of [0,4]) {
            scene.hud.setRainStoneCount(count);
            const zone=scene.boatTravel.docks.mainland.zone;
            scene.player.body.reset(zone.x-45,DOCKS.mainland.y);
            await pause(200);
            check(!scene.boatTravel.isTravelling && scene.player.body.enable, count+'顆時不能搭船');
            check(scene.boatTravel.boardingDialogue?.isActive(), '不足五顆以對話提醒');
            scene.boatTravel.boardingDialogue.cancel();
            await pause(150);
            check(!DialogueSystem.isShowing(), '站在碼頭不重複彈出對話');
            scene.player.body.reset(DOCKS.mainland.landing.x,DOCKS.mainland.landing.y);
            await pause(150);
        }
        scene.hud.setRainStoneCount(5);
        await voyage('mainland', 'ruins');
        await voyage('ruins', 'mainland');
        report('ALL PASSED');
    } catch (error) {report('FAIL ' + error.stack);}
    running = false; run.disabled = false; restart.disabled = false;
};
restart.onclick = () => { run.disabled = true; restart.disabled = true; scene.scene.restart(); };
await document.fonts.load('20px naikaifont');
new Phaser.Game({type:Phaser.AUTO,width:1024,height:768,parent:'game',physics:{default:'arcade',arcade:{debug:true}},scene:TestOverworld,audio:{noAudio:true}});
</script></body></html>
