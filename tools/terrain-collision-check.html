<!doctype html><html><body><pre id="result">Running terrain checks…</pre>
<script type="module">
import * as Phaser from 'phaser';
import { createTerrainCollision, createTerrainMask, terrainRectangles } from '/src/game/core/TerrainCollision.js';
const output = document.querySelector('#result');
const results = [];
function check(ok, label) { if (!ok) throw new Error(label); results.push('PASS ' + label); }
class Test extends Phaser.Scene {
 preload() {
  this.load.image('water_flow_dry', '/assets/backgrounds/water_flow_dry.webp');
  this.load.image('map', '/assets/backgrounds/background_whole.webp');
  this.load.image('player', '/assets/main_characters/main_character_stand_still.png');
 }
 create() {
  try {
   this.physics.world.autoUpdate = false;
   this.add.image(0, 0, 'map').setOrigin(0);
   const player = this.physics.add.sprite(700, 100, 'player').setScale(0.4);
   const rawWidth = player.body.width, rawHeight = player.body.height;
   player.body.setSize(rawWidth, rawHeight * 0.5).setOffset(0, rawHeight * 0.5);
   this.playerController = { sprite: player };
   const terrain = createTerrainCollision(this);
   const cleanup = this.events.listeners('shutdown').at(-1);
   this.physics.world.setBounds(0, 0, 5161, 2904);
   const walls = terrain.walls.getChildren();
   const scaleX = 5161 / 1300, scaleY = 2904 / 731;
   const blocked = (x,y) => walls.some(w => w.body.hitTest(x*scaleX,y*scaleY));
   for (const [name,x,y] of [['east river',1280,200],['south river',800,720],['west river',10,550],['tributary',700,530],['north hill',970,420],['south hill',990,480]]) check(blocked(x,y),name+' covered');
   for (const [name,x,y] of [['spawn',176,25],['white road',350,160],['elephant road',1100,230],['pond',375,495],['mainland',600,450],['south land',1000,560]]) check(!blocked(x,y), name+' open');
   const move = (x,y,vx,vy,steps=180) => {
    player.body.reset(x*scaleX,y*scaleY);
    for(let i=0;i<steps;i++) {
     player.setVelocity(vx,vy);
     this.physics.world.update(0,1000/60);
     this.physics.world.postUpdate();
    }
    return {x:player.x/scaleX,y:player.y/scaleY};
   };
   for(const speed of [160,480,800]) {
    check(move(1190,200,speed,0).x < 1255, 'east river stops speed '+speed);
    check(move(200,640,0,speed).y < 699, 'south river stops speed '+speed);
    check(move(100,500,-speed,0).x > 20, 'west river stops speed '+speed);
    check(move(650,530,speed,0).x < 715, 'tributary stops speed '+speed);
    check(move(975,365,0,speed).y < 403, 'hill north stops speed '+speed);
    check(move(975,550,0,-speed).y > 490, 'hill south stops speed '+speed);
    check(move(910,370,speed*0.7071,speed*0.7071).y < 460, 'diagonal hill approach speed '+speed);
   }
   move(1190,200,480,0);
   const before=player.x;
   for(let i=0;i<60;i++){player.setVelocity(-160,0);this.physics.world.update(0,1000/60);this.physics.world.postUpdate();}
   check(player.x < before-100,'can move away after hitting river');
   const count=walls.length;
   cleanup(); this.events.off('shutdown',cleanup); this.physics.world.postUpdate();
   // Separate scene lifecycle check uses the real shutdown hook.

   check(this.physics.world.staticBodies.size===0,'shutdown removes terrain bodies');
   createTerrainCollision(this);
   check(this.physics.world.staticBodies.size===count,'recreation does not duplicate terrain bodies');
   const graphics=this.add.graphics().fillStyle(0xff0000,0.35);
   for(const wall of this.physics.world.staticBodies){graphics.fillRect(wall.x,wall.y,wall.width,wall.height);}
   this.cameras.main.setZoom(1300/5161).setScroll((5161-1300)/2,(2904-731)/2);
   output.textContent=results.join('\n')+'\n'+count+' static rectangles; ALL PASSED';
  } catch(error) {output.textContent=results.join('\n')+'\nFAIL '+error.stack;}
 }
}
new Phaser.Game({type:Phaser.CANVAS,width:1300,height:731,physics:{default:'arcade'},scene:Test,audio:{noAudio:true}});
</script></body></html>
