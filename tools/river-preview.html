<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<base href="/">
<title>碼頭流程測試</title>
<style>body{margin:0;background:#222;color:white;font:14px sans-serif}nav{padding:8px;display:flex;gap:8px}#game-container{height:80vh}pre{white-space:pre-wrap;margin:8px}</style>
<nav><button disabled id="trip">五顆石頭：上船</button><button disabled id="shallows">前往淺灘</button><button disabled id="six">取得第六顆</button><button disabled id="current">前往上游入口</button><button disabled id="run">自動測試</button></nav>
<div id="game-container"></div><pre id="result">載入中</pre>
<script type="module">
import StartGame from '/src/game/main.js';
import { SHALLOW_BERTH } from '/src/game/core/DockLayout.js';
const game = StartGame('game-container');
const output = document.querySelector('#result');
const log = text => { output.textContent += '\n' + text; };
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
async function until(fn, timeout = 16000) {
    const end = Date.now() + timeout;
    while (!fn()) { if (Date.now() > end) throw Error('等待狀態逾時'); await wait(100); }
}
await until(() => game.scene.getScene('Overworld')?.boatTravel, 30000);
const scene = game.scene.getScene('Overworld');
scene.physics.world.drawDebug = false;
scene.physics.world.debugGraphic.clear();
output.textContent = '就緒';
document.querySelectorAll('button').forEach(button => { button.disabled = false; });
const move = (x, y) => scene.playerController.sprite.body.reset(x, y);
document.querySelector('#trip').onclick = () => { scene.hud.setRainStoneCount(5); move(4970, 1665); };
document.querySelector('#shallows').onclick = () => move(SHALLOW_BERTH.x + 230, SHALLOW_BERTH.y - 30);
document.querySelector('#six').onclick = () => scene.hud.addRainStone();
document.querySelector('#current').onclick = () => move(5020, 2160);
document.querySelector('#run').onclick = async () => {
    try {
        const check = (condition, message) => { if (!condition) throw Error(message); log('PASS: ' + message); };
        const travel = scene.boatTravel;
        scene.hud.setRainStoneCount(5); move(4970, 1665);
        await until(() => travel.isTravelling);
        check(!scene.playerController.enabled, '搭船時鎖定玩家');
        await until(() => travel.phase === 'drifting');
        check(scene.playerController.enabled, '下船後恢復操作，船自行漂流');
        await until(() => travel.phase === 'stranded');
        move(SHALLOW_BERTH.x + 230, SHALLOW_BERTH.y - 30);
        check(travel.boat.angle === 90, '淺灘船身直立');
        check(travel.boat.x === SHALLOW_BERTH.x && travel.boat.y === SHALLOW_BERTH.y, '船停在指定的南側河道');
        const blocked = (x, y) => scene.terrainCollision.walls.getChildren().some(wall => wall.getBounds().contains(x, y));
        check(!blocked(4300, 2800), '右下水面無隱形牆');
        check(!blocked(SHALLOW_BERTH.x, SHALLOW_BERTH.y), '可接近淺灘的船');
        check([2750, 2820, 2890].every(y => blocked(SHALLOW_BERTH.x - 150, y)), '船左側河道整段禁止步行');
        check(blocked(3300, 2810) && blocked(2750, 2790), '往教學區的河道只能搭船通過');
        check(!blocked(3500, 2600), '河道旁陸地仍可行走');
        check(blocked(5040, 1750), '東側上游保持阻擋');
        check(blocked(2950, 2330), '支流上游保持阻擋');
        check(blocked(4050, 1790), '山丘阻擋保持有效');
        check(travel.currentZones.length === 1, '只保留最右側水流偵測框');
        check(travel.currentZones[0].getBounds().left === 4895 && travel.currentZones[0].getBounds().right === 5160, '偵測框符合指定座標');
        check(blocked(5040, 2050), '偵測框上方水面禁止步行');
        await wait(2000);
        scene.giveRainStone();
        await until(() => travel.isReleasing);
        check(scene.hud.feedbackEndsAt === 0 && travel.boat.angle === 90, '獲得石頭動畫結束後才開始船的運鏡');
        const lockedPosition = { x: scene.player.x, y: scene.player.y };
        const cameraStart = { x: scene.cameras.main.scrollX, y: scene.cameras.main.scrollY };
        await wait(1800);
        check(!scene.playerController.enabled && !scene.input.keyboard.enabled && !scene.player.body.enable, '船回正期間鎖住移動與按鍵');
        check(scene.player.x === lockedPosition.x && scene.player.y === lockedPosition.y, '運鏡期間玩家保持原位');
        check(travel.boat.angle < 90 && travel.boat.angle > 0, '鏡頭抵達後播放回正動畫');
        check(scene.cameras.main.scrollX !== cameraStart.x || scene.cameras.main.scrollY !== cameraStart.y, '鏡頭已移向擱淺船');
        await until(() => travel.phase === 'returnReady');
        check(scene.input.keyboard.enabled && scene.player.body.enable, '鏡頭回來後恢復操作');
        check(travel.boat.angle === 0, '六顆石頭後船身恢復水平');
        await until(() => scene.playerController.enabled);
        check(scene.sys.isActive(), '正常領取第六顆後不會跳過回程');
        move(SHALLOW_BERTH.x + 60, SHALLOW_BERTH.y - 40);
        await until(() => travel.isTravelling);
        await until(() => travel.phase === 'complete');
        check(scene.playerController.sprite.x === 350 && scene.playerController.sprite.y === 1650, '抵達教學區');
        check(scene.playerController.enabled && scene.playerController.sprite.visible, '回程恢復角色顯示與操作');
        log('全部測試通過');
    } catch (error) { log('FAIL: ' + error.message); }
};
</script>
</html>
